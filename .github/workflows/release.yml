name: Release
# Push a tag like v2026.10.11 and this publishes a GitHub Release whose notes are the changelog entries since the
# previous tag, grouped by area (scripts/release_notes.py).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from docs/changelog.json
        run: python scripts/release_notes.py --tag "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Shell:B $GITHUB_REF_NAME" --notes-file notes.md
