<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest-guest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d1f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shell:B</title>
    <script>
      try { if (localStorage.getItem('shellb.theme') === 'light') document.documentElement.className = 'light'; } catch {}
      // theme before first paint: mirrors index.html (built-in themes only; guests can't design custom ones)
      (function () {
        var sk = 'synthfield', d = document.documentElement; try { sk = localStorage.getItem('shellb.skin') || sk; } catch {}
        if (['synthfield', 'synthwave', 'normandy', 'sakura', 'pandora', 'rain', 'abyss', 'arrakis', 'borealis', 'ghibli'].indexOf(sk) >= 0) d.dataset.skin = sk;
      })();
      // ?shot[=ms] holds the load event for headless `firefox --screenshot` (shot.sh), like index.html
      var shot = /[?&]shot(?:=(\d+))?/.exec(location.search);
      if (shot) document.write('<style>*{animation:none!important;transition:none!important}</style><img src="/api/_hold?ms=' + (shot[1] || 4000) + '" style="display:none" alt="">');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/guest/main.tsx"></script>
  </body>
</html>
